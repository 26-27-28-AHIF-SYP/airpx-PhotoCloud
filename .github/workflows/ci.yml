name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode verify
      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/failsafe-reports/*.xml
          if-no-files-found: warn

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android build and tests
        working-directory: androidApp
        run: ./gradlew assembleDebug test
      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: androidApp/app/build/test-results/**/*.xml
          if-no-files-found: warn

  ios:
    name: iOS sync tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Run iOS sync tests
        working-directory: iosApp/PhotoCloudSync
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
        shell: bash
      - name: Upload iOS test log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-log
          path: iosApp/PhotoCloudSync/swift-test.log
          if-no-files-found: warn

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: webapp
        run: npm ci
      - name: Build web app
        working-directory: webapp
        run: npm run build
