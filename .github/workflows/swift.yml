# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main", "production-testing"  ]
  pull_request:
    branches: [ "main", "production-testing" ]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iosApp/PhotoCloudSync

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - name: Test iOS app package
      run: xcodebuild test -scheme airpix-Package -destination 'platform=iOS Simulator,name=iPhone 17'
      working-directory: iosApp/airpix
