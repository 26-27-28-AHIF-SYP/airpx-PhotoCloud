services:
  app:
    build: .
    container_name: quarkus-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      AUTH_TOKEN_LIFETIME: ${AUTH_TOKEN_LIFETIME:-PT8H}
      PHOTO_STORAGE_DIRECTORY: ${PHOTO_STORAGE_DIRECTORY:-/var/lib/photocloud/photos}
      PHOTO_MAX_BODY_SIZE: ${PHOTO_MAX_BODY_SIZE:-100M}
      PHOTO_MAX_SIZE: ${PHOTO_MAX_SIZE:-25M}
      PHOTO_PAGE_SIZE_MAX: ${PHOTO_PAGE_SIZE_MAX:-100}

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - photo_data:/var/lib/photocloud/photos

  db:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ../webapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  photo_data:
