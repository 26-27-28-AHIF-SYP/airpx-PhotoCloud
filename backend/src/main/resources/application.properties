# ====================
# DEVELOPMENT
# ====================
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.enabled=true


# ====================
# TEST
# ====================
%test.quarkus.datasource.db-kind=postgresql

# Keine JDBC-URL angeben, dadurch können Quarkus Dev Services automatisch PostgreSQL starten.


# ====================
# PRODUCTION
# ====================

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME}


# ====================
# Hibernate
# ====================

%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
# Prüft, ob die Datenbankstruktur zu den Java-Entities passt,
# weicht etwas ab (bspw. Spalte fehlt), bricht Backend ab.

# ====================
# AUTHENTICATION
# ====================
# Optional: create the first local user on startup. Set these through
# environment variables in a deployment instead of committing credentials.
auth.bootstrap.username=${AUTH_BOOTSTRAP_USERNAME}
auth.bootstrap.email=${AUTH_BOOTSTRAP_EMAIL}
auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD}
auth.token-lifetime=${AUTH_TOKEN_LIFETIME:PT8H}