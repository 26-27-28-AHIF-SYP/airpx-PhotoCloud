openapi: 3.1.0
info:
  title: AirPx PhotoCloud API
  version: 1.0.0
  description: >
    Contract for the iOS milestone covering server validation, login,
    manual photo and video backup, and listing and managing the user's photos.
servers:
  - url: /
    description: The client supplies the user's server origin.

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      operationId: getServerInfo
      summary: Validate a server URL and identify the server
      security: []
      responses:
        "200":
          description: Server is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in and obtain a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/photos/missing:
    post:
      operationId: findMissingPhotos
      summary: Find which content hashes are not stored for this user
      description: >
        Hashes are lowercase SHA-256 hex digests of the original file bytes,
        not an edited render or a thumbnail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissingPhotosRequest"
      responses:
        "200":
          description: Hashes not currently stored for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingPhotosResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/photos:
    post:
      operationId: uploadPhoto
      summary: Upload one photo or video with its metadata
      description: >
        Send one original file and its JSON metadata as multipart/form-data.
        The server streams the file and verifies that its SHA-256 matches
        contentHash. Content hashes are unique per user. Repeating an upload
        with a hash already stored for that user returns the existing photo,
        making retries safe if the original response was lost. This milestone
        uses one request per file; interrupted uploads must be retried from
        the beginning. There is no API-level upload size limit in this
        contract, but server and reverse-proxy limits still apply. In
        particular, nginx's default client_max_body_size is 1 MB and must be
        raised or disabled for photo and video uploads.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - metadata
              properties:
                file:
                  type: string
                  format: binary
                  description: Original photo or video file; these exact bytes are hashed.
                metadata:
                  $ref: "#/components/schemas/UploadMetadata"
            encoding:
              metadata:
                contentType: application/json
      responses:
        "200":
          description: This content hash was already stored; existing photo returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "201":
          description: Photo or video stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

    get:
      operationId: listPhotos
      summary: List the authenticated user's photos and videos
      description: >
        Pages are ordered by capture date descending, with photos lacking a
        capture date last and photo ID as a stable tie-breaker.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of items in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of the user's photos and videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/photos/{photoId}/thumbnail:
    get:
      operationId: downloadThumbnail
      summary: Download a photo's thumbnail
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Thumbnail bytes; Content-Type identifies the image format.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/photos/{photoId}/original:
    get:
      operationId: downloadOriginal
      summary: Download a photo's or video's original file
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Original file bytes; Content-Type identifies the media format.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/photos/{photoId}:
    delete:
      operationId: deletePhoto
      summary: Delete a photo or video from the server
      description: Deletes the server copy only; it does not delete the local item on the phone.
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Server copy deleted.
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string

  responses:
    ErrorResponse:
      description: Request failed. Error responses use the common problem format.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ServerInfo:
      type: object
      required:
        - name
        - apiVersion
        - status
      properties:
        name:
          type: string
          description: Human-readable server name.
        apiVersion:
          type: string
          const: "1"
          description: Supported API major version.
        status:
          type: string
          const: ok

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
          description: ISO 8601/RFC 3339 expiration time.

    ContentHash:
      type: string
      pattern: "^[a-f0-9]{64}$"
      description: Lowercase hexadecimal SHA-256 digest of the original file bytes.

    MissingPhotosRequest:
      type: object
      required:
        - hashes
      properties:
        hashes:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ContentHash"

    MissingPhotosResponse:
      type: object
      required:
        - missingHashes
      properties:
        missingHashes:
          type: array
          items:
            $ref: "#/components/schemas/ContentHash"

    UploadMetadata:
      type: object
      required:
        - capturedAt
        - originalFilename
        - contentHash
        - mediaType
        - width
        - height
      properties:
        capturedAt:
          type:
            - string
            - "null"
          format: date-time
          description: ISO 8601/RFC 3339 capture time, or null if unavailable.
        location:
          oneOf:
            - $ref: "#/components/schemas/PhotoLocation"
            - type: "null"
          description: Omit or set to null when location is unavailable.
        originalFilename:
          type: string
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        mediaType:
          type: string
          enum:
            - photo
            - video
        width:
          type: integer
          minimum: 0
          description: Pixel width.
        height:
          type: integer
          minimum: 0
          description: Pixel height.
        livePhotoPairId:
          type:
            - string
            - "null"
          description: >
            Optional opaque identifier shared by the still-image and motion
            video resources of one Live Photo.

    PhotoLocation:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    Photo:
      type: object
      required:
        - id
        - contentHash
        - uploadedAt
        - metadata
        - thumbnailUrl
        - originalUrl
      properties:
        id:
          type: string
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        uploadedAt:
          type: string
          format: date-time
          description: ISO 8601/RFC 3339 time the server accepted the upload.
        metadata:
          $ref: "#/components/schemas/PhotoMetadata"
        thumbnailUrl:
          type: string
          format: uri
          description: Same-server URL for the authenticated thumbnail route.
        originalUrl:
          type: string
          format: uri
          description: Same-server URL for the authenticated original route.

    PhotoMetadata:
      type: object
      required:
        - capturedAt
        - originalFilename
        - mediaType
        - width
        - height
      properties:
        capturedAt:
          type:
            - string
            - "null"
          format: date-time
        location:
          oneOf:
            - $ref: "#/components/schemas/PhotoLocation"
            - type: "null"
        originalFilename:
          type: string
        mediaType:
          type: string
          enum:
            - photo
            - video
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
        livePhotoPairId:
          type:
            - string
            - "null"

    PhotoPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        nextCursor:
          type:
            - string
            - "null"
          description: Opaque cursor for the next page, or null when complete.

    ApiError:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: >
            Stable machine-readable error code. Use token_expired for an
            expired bearer token so the client can request login again.

# Later: albums, sharing and permissions, AI features, and end-to-end encryption (E2EE).
# Wi-Fi-only upload preference is a later iOS client feature, not an API route.
# Resumable uploads are deferred: this contract accepts one streamed multipart request
# per file, and an interrupted upload is retried from the beginning.
#
# Open questions for the backend developer:
# 1. This milestone has no refresh route. What long-lived token lifetime should be
#    issued? The client will treat an expired-token 401 as a re-login-required state
#    and retain failed uploads so they can be retried after login.
# 2. There is no API-level upload size cap. What deployment limit, if any, should be
#    recommended? Ensure the backend and reverse-proxy configuration accept large
#    streamed bodies; nginx defaults client_max_body_size to 1 MB.
# 3. Does storing a shared livePhotoPairId on the still and video records meet the
#    backend's needs, with the client grouping records that share that value?
# 4. Should repeated uploads with an already-stored per-user hash always return the
#    existing record, even if the request supplies different metadata?
# 5. The client must obtain the original bytes before hashing or uploading. For
#    iCloud-optimized assets this may require downloading from iCloud first; what
#    user-visible progress, cancellation, and retry behavior should the iOS app use?
# 6. This contract assumes captures without a capture date are accepted as null and
#    listed after dated items, and that uploadedAt is the server acceptance time.
# 7. Thumbnail and original URLs are same-server authenticated URLs; confirm whether
#    the backend can return absolute URLs or whether clients should resolve paths
#    against the configured server origin.
